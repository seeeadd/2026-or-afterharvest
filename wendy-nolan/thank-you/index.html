zer",system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif; --label:"Switzer",system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif; --lw:600; --ltr:.04em; --dw:600; --dw2:500; }</style><style>@font-face{font-family:"Instrument Serif";font-style:italic;font-weight:400;font-display:swap;src:url(../fonts/instrument-serif-latin-400-italic.woff2) format("woff2")}@font-face{font-family:"Gochi Hand";font-style:normal;font-weight:400;font-display:swap;src:url(../fonts/gochi-hand-400.woff2) format("woff2")}</style>

<style>
/* ==== Wendy Nolan, hand layer shared by the VIP, thank-you and offer pages (leads/wendy-nolan/hand-src/, build.py).
   Same brand as her registration layer: blush ground, cream sections, navy ink, coral for fills and doodles only,
   deep coral #a82c3b for coral words, honey second accent, Gochi Hand notes, drawn icons (navy line over a blob).
   50+ layer: body 18 (17 on phones), line 1.6, nothing under 14px, buttons 56px, chips 48px. */
@font-face{font-family:"Gochi Hand";font-style:normal;font-weight:400;font-display:swap;src:url(../fonts/gochi-hand-400.woff2) format("woff2")}
:root{--fh:"Gochi Hand",cursive;--hand-ink:#a82c3b;--honey:#f2b544;--cream:#fdf5ee;--blush2:#f9d6d0;--sticky:#ffe6a6;--mark:#ffd180;
  --wline:rgba(21,49,76,.14);--wshadow:0 1px 0 rgba(21,49,76,.05),0 18px 40px -26px rgba(21,49,76,.42);--muted:#3a4d63;--ink-soft:#233a52}
body{font-size:18px;line-height:1.6}
.vgrid,.vgrain{display:none}
.vground{background:linear-gradient(180deg,#fbe6e2 0,#fbe6e2 60%,#fdf5ee 100%)!important}

/* her drawn language replaces the template sparkle */
.vspark{width:64px;height:12px;border-radius:0;-webkit-mask:none;mask:none;background:url("data:image/svg+xml,%3Csvg preserveAspectRatio=%22none%22 xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 240 18%22%3E%3Cg fill=%22none%22 stroke=%22%23ef5a68%22 stroke-linecap=%22round%22%3E%3Cpath stroke-width=%225%22 d=%22M4 10.5C58 5 132 3.6 236 6.4%22/%3E%3Cpath stroke-width=%222.6%22 d=%22M30 14.6c52-3.2 110-4 172-2.6%22/%3E%3C/g%3E%3C/svg%3E") no-repeat center/contain}
.vcap{font:700 15px/1.2 var(--label);letter-spacing:.06em;color:var(--hand-ink)}

/* the coral doodle underline, under one phrase of a heading */
.xdood{position:relative;display:inline-block;white-space:nowrap;padding-bottom:.08em;background:url("data:image/svg+xml,%3Csvg preserveAspectRatio=%22none%22 xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 240 18%22%3E%3Cg fill=%22none%22 stroke=%22%23ef5a68%22 stroke-linecap=%22round%22%3E%3Cpath stroke-width=%225%22 d=%22M4 10.5C58 5 132 3.6 236 6.4%22/%3E%3Cpath stroke-width=%222.6%22 d=%22M30 14.6c52-3.2 110-4 172-2.6%22/%3E%3C/g%3E%3C/svg%3E") no-repeat 0 100%/100% .3em}
.xhand{font-family:var(--fh);font-weight:400;color:var(--hand-ink);line-height:1.05;white-space:nowrap}

/* progress header: readable labels */
.vl{font-size:15px}
.vsteps .vn{font-size:14px}
.vstepof{font-size:14px;letter-spacing:.04em}
.vheld{font-size:16px}

/* buttons: 56px, calm hover */
.vcta,.obtn{min-height:56px;font-size:18px}
.vcta:focus-visible,.obtn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

@media (max-width:720px){
  body{font-size:17px}
  .vl{font-size:14px}
  .vbar .vsteps li:not(.now) .vl{display:none}
  .vheld{font-size:15px}
}

  *,*:before,*:after{animation:none!important;transition:none!important}
}

/* ---------- thank-you page (site/<slug>/thank-you/) */
/* welcome: her hand note under the headline */
.tcong .th1{text-wrap:balance}
.tcong .tsub{font-size:19px;line-height:1.6;color:var(--ink-soft)}
.xwel{display:inline-block;margin-top:14px;font-size:30px;transform:rotate(-3deg);position:relative;padding-left:52px}
.xwel i{position:absolute;left:0;top:-14px;width:44px;height:44px;background:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 56 46%22%3E%3Cg fill=%22none%22 stroke=%22%23a82c3b%22 stroke-width=%222.4%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M52 5C38 6 22 12 12 34%22/%3E%3Cpath d=%22M6 24l5 12 11-6%22/%3E%3C/g%3E%3C/svg%3E") no-repeat center/contain;transform:scaleX(-1) rotate(10deg)}

/* the two videos, framed like photos on her fridge: white frame, honey tape, a small tilt */
.tvids{gap:40px}
.tvid{position:relative;background:#fff;border:0;border-radius:22px;padding:14px 14px 4px;box-shadow:var(--wshadow);overflow:visible}
.tvid:nth-child(1){transform:rotate(-1.2deg)}
.tvid:nth-child(2){transform:rotate(1deg)}
.tvid:before{content:"";position:absolute;z-index:3;top:-14px;left:50%;width:110px;height:28px;margin-left:-55px;background:var(--honey);opacity:.85;transform:rotate(-3deg);border-radius:3px}
.tvid:nth-child(2):before{transform:rotate(4deg);background:var(--blush2);opacity:1}
.tvid .tshot{border-radius:14px}
.tvid .tlen{font-size:14px}
.tvid .tsoon{font-size:15px}
.tvid .tcap{padding:18px 8px 16px}
.tvid small{font:700 15px/1 var(--label);letter-spacing:.06em;color:var(--hand-ink)}
.tvid h3{font-size:24px}
.tvid p{font-size:17px;line-height:1.55;color:var(--ink-soft)}

/* prep: the stitched hearts fill up as she ticks steps off */
.tmeter{height:0;background:none;max-width:none;margin-top:0}
.tmeter i{display:none}
.tmeter span{position:static;display:block;margin-top:12px;font:600 17px/1.2 var(--label);color:var(--ink);letter-spacing:0}
.xhearts{display:flex;justify-content:center;gap:16px;margin:20px auto 0}
.xhearts svg{width:46px;height:42px;overflow:visible}
.xhearts path{fill:#fff;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;transition:fill .45s}
.xhearts .st{fill:none;stroke:var(--hand-ink);stroke-width:1.8;stroke-dasharray:3 4;stroke-linecap:round}
.xhearts .on path{fill:var(--accent)}
.xhearts .on .st{fill:none;stroke:#fff}
@media (prefers-reduced-motion:no-preference){.xhearts .pop{animation:xpop .5s cubic-bezier(.3,1.6,.5,1)}}
@keyframes xpop{40%{transform:scale(1.18)}}
.xhearts span{display:inline-block}

/* the three steps: coral numeral over her drawn icon */
.tsteps{gap:18px}
.tstep{grid-template-columns:96px minmax(0,1fr);background:#fff;border:2px solid transparent;border-radius:24px;box-shadow:var(--wshadow);padding:28px 30px}
.tstep.done{border-color:var(--accent);background:#fff8f6}
.tnum{display:flex;flex-direction:column;align-items:flex-start;gap:12px;font-size:44px;color:var(--accent)}
.tnum:after{content:"";width:64px;height:64px;border-radius:20px;background:var(--cream) no-repeat center/48px}
#sCal .tnum:after{background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 48%22%3E%3Ccircle cx=%2228%22 cy=%2229%22 r=%2215%22 fill=%22%23f2b544%22/%3E%3Cpath fill=%22none%22 stroke=%22%2315314c%22 stroke-width=%222.3%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22 d=%22M9.6 11.4c9.6-.6 19.4-.6 28.8 0 1.8.1 2.9 1.3 3 3.2.3 7.8.3 15.8 0 23.4-.1 1.9-1.2 3.1-3 3.2-9.4.6-19.2.6-28.8 0-1.8-.1-2.9-1.3-3-3.2-.3-7.6-.3-15.6 0-23.4.1-1.9 1.2-3.1 3-3.2z%22/%3E%3Cpath fill=%22none%22 stroke=%22%2315314c%22 stroke-width=%222.3%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22 d=%22M6.8 19.4h34.6M16.4 7.4v7.4M31.6 7.4v7.4%22/%3E%3Cpath fill=%22%23ef5a68%22 d=%22M15 25h6v5.4h-6z%22/%3E%3Cpath fill=%22none%22 stroke=%22%2315314c%22 stroke-width=%222.3%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22 d=%22M26.4 27.6h7M15.4 34h18%22/%3E%3C/svg%3E")}
#sConfirm .tnum:after{background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 48%22%3E%3Ccircle cx=%2228%22 cy=%2229%22 r=%2215%22 fill=%22%23f9d6d0%22/%3E%3Cpath fill=%22none%22 stroke=%22%2315314c%22 stroke-width=%222.3%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22 d=%22M24 40.6C14 33.4 7.2 27 7.4 19.2c.2-5.8 4.6-9.8 9.6-9.6 3.2.1 5.6 1.8 7 4.6 1.4-2.8 3.8-4.5 7-4.6 5-.2 9.4 3.8 9.6 9.6.2 7.8-6.6 14.2-16.6 21.4z%22/%3E%3Cpath fill=%22none%22 stroke=%22%23a82c3b%22 stroke-width=%222.8%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22 d=%22M17 22.4l4.8 4.8 9-9%22/%3E%3C/svg%3E")}
#sGoal .tnum:after{background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 48%22%3E%3Ccircle cx=%2227%22 cy=%2229%22 r=%2215%22 fill=%22%23f2b544%22/%3E%3Cpath fill=%22none%22 stroke=%22%2315314c%22 stroke-width=%222.3%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22 d=%22M8.4 9.4c8.4-.4 16.6-.4 24.6 0l.4 17.8-7.2 7.6c-6 .3-12 .3-17.6 0z%22/%3E%3Cpath fill=%22none%22 stroke=%22%2315314c%22 stroke-width=%222.3%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22 d=%22M33.4 27.2l-7.4.2-.2 7.4%22/%3E%3Cpath fill=%22none%22 stroke=%22%2315314c%22 stroke-width=%222.3%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22 d=%22M13.4 16.4h14M13.4 21.6h9%22/%3E%3Cpath fill=%22none%22 stroke=%22%2315314c%22 stroke-width=%222.3%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22 d=%22M42.4 13.6l-12.6 17-4.4 1.6.8-4.6 12.6-17c.9-1.2 2.5-1.4 3.6-.5 1.1.9 1.1 2.4 0 3.5z%22/%3E%3C/svg%3E")}
.tstep h3{font-size:24px}
.tstep h3 em{font-size:16px}
.tstep p{font-size:18px;line-height:1.6;color:var(--ink-soft)}
.tcal{min-height:56px;height:auto;padding:0 22px;font-size:16px;border-width:2px}
.tcal:hover{background:var(--ink);color:#fff}
/* "I'm locked in": navy card, a drawn heart ticks on, a hand note says yes */
.tlock{min-height:64px;border-radius:999px;padding:0 28px 0 12px;border:2px solid var(--ink);background:#fff;font-size:18px}
.tlock:hover{background:var(--cream)}
.tlock .tbox{width:42px;height:42px;border-radius:50%;border:2px dashed var(--hand-ink);background:#fff}
.tlock[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.tlock[aria-pressed="true"] .tbox{border:0;background:var(--accent) url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Cpath fill=%22none%22 stroke=%22%231a1a1a%22 stroke-width=%223.2%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22 d=%22M5 12.6l4.6 4.6L19 7.6%22/%3E%3C/svg%3E") no-repeat center/22px}
.tlock[aria-pressed="true"] .tbox:after{display:none}
@media (prefers-reduced-motion:no-preference){.tlock[aria-pressed="true"] .tbox{animation:xpop .5s cubic-bezier(.3,1.6,.5,1)}}
.xlocked{display:inline-block;margin:14px 0 0 18px;font-size:27px;transform:rotate(-3deg);opacity:0;transition:opacity .35s}
#sConfirm.done .xlocked{opacity:1}
#tForm textarea,#tForm select{font-size:18px;min-height:56px;border-width:2px;border-radius:16px}
#tForm textarea::placeholder{color:#5b6b7d}
.tf label{font-size:15px}
.tsave{min-height:56px}
.tnote{font-size:16px}

/* proof: warm cards, a honey ring round each number */
.tproof .vh2{font-size:clamp(28px,3vw,38px)}
.tstats{gap:22px}
.tstat{background:#fff;border-radius:24px;box-shadow:var(--wshadow);padding:26px 14px 22px}
.tstat:nth-child(1){transform:rotate(-1.5deg)}
.tstat:nth-child(3){transform:rotate(1.5deg)}
.tstat b{position:relative;z-index:0;display:inline-block;padding:14px 18px;font-size:34px}
.tstat b:before{content:"";position:absolute;inset:-6px -18px;z-index:-1;background:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Cpath fill=%22none%22 stroke=%22%23f2b544%22 stroke-width=%224.4%22 stroke-linecap=%22round%22 d=%22M58 8C30 4 8 22 9 50c1 26 22 42 46 40 24-2 38-22 36-44C89 24 72 10 48 12%22/%3E%3C/svg%3E") no-repeat center/100% 100%}
.tstat span{display:block;font-size:16px;color:var(--ink-soft)}
.tnext{font-size:18px;line-height:1.6;background:var(--sticky);color:var(--ink);border-radius:4px 4px 24px 4px;padding:22px 26px;max-width:560px;margin:48px auto 0;transform:rotate(-1deg);box-shadow:0 18px 28px -20px rgba(21,49,76,.5)}
.tfoot{font-size:15px;color:var(--muted)}

@media (max-width:720px){
  .xwel{font-size:25px}
  .tcong .tsub{font-size:17px}
  .tvid{transform:none!important}
  .tstep{grid-template-columns:minmax(0,1fr);padding:22px 20px}
  .tnum{flex-direction:row;align-items:center;font-size:36px}
  .tnum:after{width:52px;height:52px;background-size:40px;border-radius:16px}
  .tstep p{font-size:17px}
  .tlock{width:100%}
  .tstat{transform:none!important}
}

</style>

<body class="typ">
<!-- Thank-you page, the page after the VIP step (regular success page): welcome, HOW video, WHY video, then the
     stacked micro-commitments (add to calendar, confirm, goal, time zone) and social proof. Built by
     scripts/build_typ.py from templates/lp/typ.{html,css,js} + lp.json site.typ. Never hand-edit. -->
<div id="vpage" class="tpage">
  <div class="vbg vground"></div>
  <div class="vbg vgrid"></div>
  <div class="vbg vgrain"></div>

  <header class="vbar">
    <div class="vbar-in">
      <span class="vlock">
        <span class="vcal"><svg width="34" height="34" viewBox="0 0 40 40"><rect x="1" y="1" width="38" height="38" rx="10" fill="var(--accent)"/><path d="M1 11a10 10 0 0 1 10-10h18a10 10 0 0 1 10 10v2H1z" fill="#000" opacity=".16"/><text x="20" y="32" text-anchor="middle" font-family="var(--display)" font-weight="700" font-size="17" fill="var(--accent-ink)">3</text></svg></span>
        <b id="vEvent"></b>
      </span>
      <ol class="vsteps" aria-label="Your progress">
        <li class="done"><span class="vn"><svg width="13" height="13" viewBox="0 0 16 16"><path d="M3.2 8.4 6.4 11.4 12.8 4.6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="vl">Seat held</span></li>
        <li class="vwire done"></li>
        <li class="done"><span class="vn"><svg width="13" height="13" viewBox="0 0 16 16"><path d="M3.2 8.4 6.4 11.4 12.8 4.6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="vl">Upgrade step</span></li>
        <li class="vwire done"></li>
        <li class="now"><span class="vn">3</span><span class="vl">Join details</span></li>
      </ol>
      <span class="vstepof">Step <b>3</b> of 3</span>
    </div>
    <div class="vtrack"><i></i></div>
  </header>

  <main class="twrap">
    <!-- SECTION 1: welcome and the two videos -->
    <section class="tsec tfirst">
      <div class="tcong">
        <span class="vspark" aria-hidden="true"></span>
        <p class="vcap" id="tKick"></p>
        <h1 class="th1" id="tH1"></h1>
        <p class="tsub" id="tSub"></p>
      </div>
      <div class="tperks" id="tPerks" hidden></div>
      <div class="tvids" id="tVids"></div>
    </section>

    <!-- SECTION 2: prep steps and proof -->
    <section class="tsec tprep" id="prep">
      <div class="thead">
        <span class="vspark" aria-hidden="true"></span>
        <p class="vcap">Your prep</p>
        <h2 class="vh2" id="tPrepH"></h2>
        <div class="tmeter" role="progressbar" aria-valuemin="0" aria-valuemax="3" aria-valuenow="0" id="tMeter"><i></i><span id="tMeterTxt"></span></div>
      </div>
      <ol class="tsteps">
        <li class="tstep" id="sCal">
          <span class="tnum">01</span>
          <div class="tbody">
            <h3>Add all 3 days to your calendar</h3>
            <p id="tCalTxt"></p>
            <div class="tcals" id="tCals"></div>
          </div>
        </li>
        <li class="tstep" id="sConfirm">
          <span class="tnum">02</span>
          <div class="tbody">
            <h3>Confirm your spot</h3>
            <p id="tConfirmTxt"></p>
            <button type="button" class="tlock" id="tLock" aria-pressed="false"><span class="tbox" aria-hidden="true"></span><span id="tLockTxt"></span></button>
          </div>
        </li>
        <li class="tstep" id="sGoal">
          <span class="tnum">03</span>
          <div class="tbody">
            <h3>Write down your biggest goal <em>(optional)</em></h3>
            <p id="tGoalTxt"></p>
            <form id="tForm" novalidate>
              <label class="vsr" for="tGoal">Your biggest goal</label>
              <textarea id="tGoal" rows="3" maxlength="400"></textarea>
              <div class="trow">
                <div class="tf"><label for="tZone">Your time zone <em>(optional)</em></label><select id="tZone"></select></div>
                <button type="submit" class="vcta tsave"><span>Save my answers</span></button>
              </div>
              <p class="tnote" id="tSaved" role="status" aria-live="polite" hidden></p>
            </form>
          </div>
        </li>
      </ol>

      <div class="tproof" id="tProof"></div>

      <div class="tnext" id="tNext"></div>
    </section>
  </main>
  <div class="tfoot" id="tFoot"></div>
</div>
