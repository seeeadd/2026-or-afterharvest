<style>
/* ==== Wendy Nolan, hand layer shared by the VIP, thank-you and offer pages (leads/wendy-nolan/hand-src/, build.py).
   Same brand as her registration layer: blush ground, cream sections, navy ink, coral for fills and doodles only,
   deep coral #a82c3b for coral words, honey second accent, Gochi Hand notes, drawn icons (navy line over a blob).
   50+ layer: body 18 (17 on phones), line 1.6, nothing under 14px, buttons 56px, chips 48px. */
@font-face{font-family:"Gochi Hand";font-style:normal;font-weight:400;font-display:swap;src:url(../fonts/gochi-hand-400.woff2) format("woff2")}
:root{--fh:"Gochi Hand",cursive;--hand-ink:#a82c3b;--honey:#f2b544;--cream:#fdf5ee;--blush2:#f9d6d0;--sticky:#ffe6a6;--mark:#ffd180;
  --wline:rgba(21,49,76,.14);--wshadow:0 1px 0 rgba(21,49,76,.05),0 18px 40px -26px rgba(21,49,76,.42);--muted:#3a4d63;--ink-soft:#233a52}
body{font-size:18px;line-height:1.6}
.vgrid,.vgrain{display:none}
.vground{background:linear-gradient(180deg,#fbe6e2 0,#fbe6e2 60%,#fdf5ee 100%)!important}

/* her drawn language replaces the template sparkle */
.vspark{width:64px;height:12px;border-radius:0;-webkit-mask:none;mask:none;background:url("data:image/svg+xml,%3Csvg preserveAspectRatio=%22none%22 xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 240 18%22%3E%3Cg fill=%22none%22 stroke=%22%23ef5a68%22 stroke-linecap=%22round%22%3E%3Cpath stroke-width=%225%22 d=%22M4 10.5C58 5 132 3.6 236 6.4%22/%3E%3Cpath stroke-width=%222.6%22 d=%22M30 14.6c52-3.2 110-4 172-2.6%22/%3E%3C/g%3E%3C/svg%3E") no-repeat center/contain}
.vcap{font:700 15px/1.2 var(--label);letter-spacing:.06em;color:var(--hand-ink)}

/* the coral doodle underline, under one phrase of a heading */
.xdood{position:relative;display:inline-block;white-space:nowrap;padding-bottom:.08em;background:url("data:image/svg+xml,%3Csvg preserveAspectRatio=%22none%22 xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 240 18%22%3E%3Cg fill=%22none%22 stroke=%22%23ef5a68%22 stroke-linecap=%22round%22%3E%3Cpath stroke-width=%225%22 d=%22M4 10.5C58 5 132 3.6 236 6.4%22/%3E%3Cpath stroke-width=%222.6%22 d=%22M30 14.6c52-3.2 110-4 172-2.6%22/%3E%3C/g%3E%3C/svg%3E") no-repeat 0 100%/100% .3em}
.xhand{font-family:var(--fh);font-weight:400;color:var(--hand-ink);line-height:1.05;white-space:nowrap}

/* progress header: readable labels */
.vl{font-size:15px}
.vsteps .vn{font-size:14px}
.vstepof{font-size:14px;letter-spacing:.04em}
.vheld{font-size:16px}

/* buttons: 56px, calm hover */
.vcta,.obtn{min-height:56px;font-size:18px}
.vcta:focus-visible,.obtn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

@media (max-width:720px){
  body{font-size:17px}
  .vl{font-size:14px}
  .vbar .vsteps li:not(.now) .vl{display:none}
  .vheld{font-size:15px}
}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}
}

/* ---------- VIP page (site/<slug>/vip/) */
/* hero: honey sticky-note eyebrow, doodle under the marked phrase */
#vpage .vtape{background:var(--sticky);color:var(--ink);font:600 16px/1.2 var(--label);letter-spacing:.02em;text-transform:none;padding:12px 20px 13px;border-radius:3px 3px 14px 3px;transform:rotate(-2deg);box-shadow:0 12px 20px -14px rgba(21,49,76,.5)}
#vpage .vtape:before,#vpage .vtape:after{display:none}
#vpage .vh1 .mk{padding-bottom:.06em;background:url("data:image/svg+xml,%3Csvg preserveAspectRatio=%22none%22 xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 240 18%22%3E%3Cg fill=%22none%22 stroke=%22%23ef5a68%22 stroke-linecap=%22round%22%3E%3Cpath stroke-width=%225%22 d=%22M4 10.5C58 5 132 3.6 236 6.4%22/%3E%3Cpath stroke-width=%222.6%22 d=%22M30 14.6c52-3.2 110-4 172-2.6%22/%3E%3C/g%3E%3C/svg%3E") no-repeat 0 100%/100% .3em}
#vpage .vh1 .mk:before,#vpage .vh1 .mk:after{display:none!important}
#vpage .vh1 .mk em{font-style:normal;color:inherit}
#vpage .vlede{font-size:19px;line-height:1.6;color:var(--ink-soft);max-width:680px}

/* the video: her warm frame, a coral block behind the screen, like her photo on her site */
#vpage .vgrid2{position:relative}
#vpage .vmon{position:relative;transform:rotate(-1deg)}

#vpage .vmon-bezel:after{display:none}
#vpage .vmon:before{content:"";position:absolute;left:22px;right:-18px;top:22px;bottom:-18px;border-radius:28px;background:var(--accent);z-index:-1}

#vpage .vneck,#vpage .vfoot,#vpage .vcam{display:none}

#vpage .vt{font-size:14px}
#vpage .vsound{font-size:14px;letter-spacing:.06em}

.xvn{position:relative;display:block;width:max-content;margin:44px 20px 0 auto;font-size:29px;transform:rotate(-3deg);padding-right:84px}
.xvn i{position:absolute;right:0;top:-30px;width:74px;height:44px;background:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 80 46%22%3E%3Cg fill=%22none%22 stroke=%22%2315314c%22 stroke-width=%222.6%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M4 30c10-18 26-24 38-14 7 6 3 14-3 11-6-3-2-13 8-15 9-2 18 2 28 8%22/%3E%3Cpath d=%22M64 13l11 7-12 5%22/%3E%3C/g%3E%3C/svg%3E") no-repeat center/contain;transform:rotate(-28deg)}

/* the pass card: cream body, coral slab, the pass as a real ticket */
#vpage .vcard{border-radius:28px;background:#fff;box-shadow:var(--wshadow);overflow:visible}
#vpage .vcardtape{background:var(--honey);opacity:.85;transform:rotate(-3deg)}
#vpage .vslab{background:var(--accent);border-radius:28px 28px 0 0;background-image:none}
#vpage .vpass{background:#fff;border-radius:18px;transform:rotate(-2deg);box-shadow:0 16px 24px -16px rgba(21,49,76,.55)}
#vpage .vstub small{font-size:14px;letter-spacing:.14em;margin-right:0}
#vpage .vpk{font-size:14px;letter-spacing:.06em;text-transform:none;color:var(--muted)}

/* the four VIP items, each with its own drawn icon */
#vpage .vlist{gap:18px}

#vpage .vcta{min-height:60px;border-radius:999px;font-size:19px}
#vpage .vsafe{font-size:14px;letter-spacing:.04em;text-transform:none;color:var(--muted)}
#vpage .vproof{font-size:16px}
#vpage .vno{font-size:16px;color:var(--ink-soft);text-decoration:underline;text-underline-offset:4px;min-height:48px;display:inline-flex;align-items:center}
.vtoast b{font-size:16px}
.vtoast small{font-size:14px}

/* optional sections (drawn only when site.vip has them): review cards, friendly compare, day cards, questions, closing */
.vvoices{background:#fff;border-radius:24px;box-shadow:var(--wshadow);padding:26px 26px 22px;margin-top:40px;position:relative}
.vvoices h3{font:600 22px/1.3 var(--display);color:var(--ink);margin-bottom:12px}
.vvoices blockquote{position:relative;background:var(--cream);border-radius:18px;padding:18px 20px 18px 62px;margin-top:12px}
.vvoices blockquote:before{content:"";position:absolute;left:18px;top:18px;width:30px;height:26px;background:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 40%22%3E%3Cpath fill=%22%23f2b544%22 d=%22M4 38V24C4 12 10 5 20 2l2 5c-6 2.6-9 7-9.4 12H21v19zm24 0V24c0-12 6-19 16-22l2 5c-6 2.6-9 7-9.4 12H45v19z%22/%3E%3C/svg%3E") no-repeat center/contain}
.vvoices blockquote p{font-size:17px;line-height:1.55;color:var(--ink)}
.vvoices mark{background:linear-gradient(transparent 56%,var(--mark) 56%);color:inherit}
.vvoices .vsrc{font-size:14px}
#vpage .vsec{padding-top:88px}
#vpage .vsec .vh2{text-wrap:balance;margin-bottom:34px}
#vpage .vsec .vcap{font-size:15px}
/* compare: a friendly table, a drawn icon tile on every row, VIP column in honey */
.vcmp .vtbl{background:#fff;border-radius:28px;box-shadow:var(--wshadow);overflow:hidden;border:0;max-width:880px;margin:0 auto}
.vcmp .vrow{padding:14px 26px;font-size:18px;border-top:1.5px dashed var(--wline);grid-template-columns:minmax(0,1.7fr) minmax(0,.65fr) minmax(0,.65fr)}
.vcmp .vrow.vrh{font:600 19px/1.2 var(--display);background:var(--cream);color:var(--ink);border-top:0;padding-top:16px;padding-bottom:16px}
.vcmp .vrl{display:flex;align-items:center;gap:14px;text-align:left;color:var(--ink);font-size:18px;line-height:1.4}
.xri{flex:none;width:48px;height:48px;border-radius:15px;background:var(--cream) no-repeat center/38px}
.vcmp .vc{display:flex;justify-content:center;align-items:center;min-height:48px}
.vcmp .vrow .vc span{font:600 16px/1.3 var(--label);color:var(--ink)}
.vcmp .vc.vipc{background:#fff5e1;border-radius:14px}
.vcmp .vrh .vipc{background:var(--honey);color:#1a1a1a;border-radius:999px;padding:10px 12px;text-align:center}
.vcmp .vtk{width:32px;height:32px;padding:6px;border-radius:50%;background:var(--accent);color:#1a1a1a}
.vcmp .vdash{font-size:22px;color:var(--muted)}

#vpage .vtl{background:var(--cream);color:var(--ink)}

#vpage .vtl .vcap{color:var(--hand-ink)}

#vpage .vdays li:nth-child(1){transform:rotate(-1deg)}
#vpage .vdays li:nth-child(3){transform:rotate(1deg)}
