<body>
<!-- VIP upsell, hero only. The page after registration: Jay's VIP layout (tape eyebrow + hand note, centred
     headline with a highlighter band, lede, video left, VIP ticket card right) under a progress header.
     Built by scripts/build_vip.py from templates/lp/vip.{html,css,js} + lp.json site.vip. Never hand-edit. -->
<div id="vpage">
  <div class="vbg vground"></div>
  <div class="vbg vgrid"></div>
  <div class="vbg vgrain"></div>

  <!-- progress header: step 1 done, step 2 active, step 3 waiting; the track under it is 2/3 full -->
  <header class="vbar">
    <div class="vbar-in">
      <span class="vlock">
        <span class="vcal"><svg width="34" height="34" viewBox="0 0 40 40"><rect x="1" y="1" width="38" height="38" rx="10" fill="var(--accent)"/><path d="M1 11a10 10 0 0 1 10-10h18a10 10 0 0 1 10 10v2H1z" fill="#000" opacity=".16"/><text x="20" y="32" text-anchor="middle" font-family="var(--display)" font-weight="700" font-size="17" fill="var(--accent-ink)">3</text></svg></span>
        <b id="vEvent"></b>
      </span>
      <ol class="vsteps" aria-label="Your progress">
        <li class="done"><span class="vn"><svg width="13" height="13" viewBox="0 0 16 16"><path d="M3.2 8.4 6.4 11.4 12.8 4.6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="vl">Seat held</span></li>
        <li class="vwire done"></li>
        <li class="now"><span class="vn">2</span><span class="vl">Complete your VIP upgrade</span></li>
        <li class="vwire"></li>
        <li class="next"><span class="vn">3</span><span class="vl">Join details</span></li>
      </ol>
      <span class="vstepof">Step <b>2</b> of 3</span>
    </div>
    <div class="vtrack"><i></i></div>
  </header>

  <!-- the seat is confirmed before we ask for anything -->
  <p class="vheld"><span class="vdot"></span><span id="vHeld"></span></p>

  <main class="vhero">
    <div class="vkick">
      <span class="vtape" id="vTape"></span>
    </div>
    <h1 class="vh1" id="vH1"></h1>
    <p class="vlede" id="vLede"></p>

    <div class="vgrid2">
      <!-- the video: a studio display, so it never reads as the registration page's iPhone -->
      <figure class="vmon">
        <div class="vmon-bezel">
          <div class="vscreen">
            <img id="vStill" alt="">
            <span class="vshade"></span>
            <span class="vchip"><img id="vAva" alt=""><span><b id="vChipName"></b><small id="vChipSub"></small></span></span>
            <button class="vplay" aria-label="Play"><span class="vring"></span><svg width="30" height="30" viewBox="0 0 24 24"><path d="M8 5.2v13.6a.8.8 0 0 0 1.2.7l10.6-6.8a.8.8 0 0 0 0-1.4L9.2 4.5A.8.8 0 0 0 8 5.2z" fill="currentColor"/></svg></button>
            <span class="vsound">Tap for sound</span>
            <div class="vctl">
              <svg width="14" height="14" viewBox="0 0 24 24"><path d="M8 5.2v13.6a.8.8 0 0 0 1.2.7l10.6-6.8a.8.8 0 0 0 0-1.4L9.2 4.5A.8.8 0 0 0 8 5.2z" fill="currentColor"/></svg>
              <span class="vt">0:00</span>
              <span class="vbarline"><i></i><b></b></span>
              <span class="vt" id="vLen"></span>
              <svg width="16" height="16" viewBox="0 0 24 24"><path d="M4 9.5h3.6L12.5 5v14l-4.9-4.5H4z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
            </div>
          </div>
          <span class="vcam"></span>
        </div>
        <span class="vneck"></span><span class="vfoot"></span>
      </figure>

      <!-- the VIP card: coral slab with the pass on it (her signature hero slab), cream body with the offer -->
      <aside class="vcard">
        <span class="vcardtape"></span>
        <div class="vslab">
          <div class="vpass">
            <span class="vstub">
              <svg class="vroundel" width="54" height="54" viewBox="0 0 54 54"><circle cx="27" cy="27" r="24.5" fill="var(--glass-solid)" stroke="var(--ink)" stroke-width="2.2"/><circle cx="27" cy="27" r="20" fill="none" stroke="var(--ink)" stroke-width=".8" opacity=".5"/><text x="21" y="34" text-anchor="middle" font-family="var(--display)" font-style="italic" font-weight="700" font-size="19" fill="var(--accent)" id="vMonoA"></text><text x="34" y="34" text-anchor="middle" font-family="var(--display)" font-weight="700" font-size="15" fill="var(--ink)" id="vMonoB"></text></svg>
              <small>VIP</small>
            </span>
            <span class="vpassbody">
              <small class="vpk" id="vPassKick"></small>
              <b class="vpt">VIP pass</b>
              <span class="vpcells" id="vCells"></span>
            </span>
          </div>
          <span class="vpill"><i></i>Optional upgrade</span>
        </div>
        <div class="vbody">
          <div class="vprice">
            <span class="vamt"><sup id="vCur"></sup><b id="vPrice"></b></span>
            <span class="vterms"><b>Pay once</b><span>Replays are yours to keep</span></span>
          </div>
          <ul class="vlist" id="vList"></ul>
          <a class="vcta" href="#" onclick="return false"><span id="vCta"></span><svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 8h9.5M8.6 3.8 12.8 8l-4.2 4.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
          <div class="vsafe"><img src="../img/lock.png" alt=""><span>Secure checkout</span><i></i><span>One payment</span></div>
          <div class="vproof"><span class="vfaces" id="vFaces"></span><span id="vProof"></span></div>
          <a class="vno" href="#" onclick="return false" id="vNo"></a>
        </div>
      </aside>
    </div>
  </main>

  <div class="vtoast" id="vToast"><span class="vtav" id="vToastAv"></span><span><b id="vToastName"></b> just added VIP<small><i></i><span id="vToastAgo"></span></small></span></div>
</div>

};</script>
