<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 798" role="img" aria-label="The Nonprofit Marketing Summit: the sun rising over a mountain range">
<defs>
 <radialGradient id="fade" cx="900" cy="470" r="1000" gradientUnits="userSpaceOnUse">
  <stop offset=".2" stop-color="#fff"/><stop offset=".42" stop-color="#fff" stop-opacity=".6"/><stop offset=".62" stop-color="#fff" stop-opacity="0"/>
 </radialGradient>
 <linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
 <mask id="rayfade"><rect width="1800" height="798" fill="url(#fade)"/><rect width="1800" height="120" fill="url(#top)"/></mask>
</defs>
<style>
 /* the sun breathes: a slow rise of a few pixels and a soft glow (Sean 2026-11-13: "turn the rays clockwise like the sun and make it
    glow subtly ... not too distracting"); off with reduced motion */
 .rayspin{transform-box:view-box;transform-origin:900px 470px}
 .sunglow{opacity:.55}
 @media (prefers-reduced-motion:no-preference){
  .rayspin{animation:rayspin 120s linear infinite}
  .sunglow{animation:sunglow 6s cubic-bezier(.45,0,.55,1) infinite alternate}
 }
 @keyframes rayspin{to{transform:rotate(360deg)}}
 @keyframes sunglow{from{opacity:.35}to{opacity:1}}
</style>
